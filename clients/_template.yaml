# Devbox client template.
#
# New client: copy this file to clients/<client>.yaml in the private
# devbox-clients repo (lowercase letters, digits and dashes), edit it, check
# it with `bin/devbox-config <client>`, and commit it there, never here.
# Anything left out falls back to defaults.yaml.
#
# Client files hold no secrets, tokens, passwords or email addresses;
# devbox-config rejects any value that looks like an email, except git_email.

# VM hostname. Default: dev-<client>.
# hostname: dev-example

# Which Claude account the devbox signs in with: a label, never an email.
# Required.
claude_account: example

# Git identity for commits in the box, written to ~/.gitconfig.local by
# `devbox finish` and re-applied by `devbox sync`. Default: empty, meaning
# your GitHub name and <id>+<login>@users.noreply.github.com. GitHub shows a
# signed commit as Verified only when git_email is a verified address on the
# GitHub account.
# git_name: Your Name
# git_email: <name>@<client-domain>

# VM resources. Each key is optional; shown values are the defaults.
# resources:
#   memory_mb: 10240   # memory ceiling, in MB
#   swap_mb: 2048      # swap, in MB (0 disables it)
#   cores: 8           # CPU cores
#   disk: 40G          # root disk size, with an M, G or T suffix
#   onboot: true       # start the VM when the host boots

# Extra pacman packages, on top of the base image.
packages:
  - jq

# mise tools, as <tool>@<version>.
tools:
  - terraform@1.9
  - python@3.12

# Extra skills, appended to the base list in defaults.yaml (ticket-skill,
# tdd-skill, humanizer-skill, mattpocock-skills). Each is a GitHub repo,
# <owner>/<repo> or a bare name under DanielUlisses, that `devbox finish`
# clones and installs into ~/.claude; mattpocock-skills is installed with
# npx skills from mattpocock/skills.
skills: []

# Repos to clone into ~/work/<repo>: GitHub ones as <owner>/<repo>, Azure
# DevOps ones as their SSH URL, git@ssh.dev.azure.com:v3/<org>/<project>/<repo>.
# `devbox finish` and `devbox sync` clone newly listed ones; removed ones are
# left in place. Azure DevOps repos wait until the box's key is added there by
# hand (devbox finish prints it).
repos:
  - example-org/example-repo
  - git@ssh.dev.azure.com:v3/example-org/example-project/example-ado-repo

# Proxmox backup job for this box: vzdump in snapshot mode, zstd, to the
# storage in $DEVBOX_BACKUP_STORAGE (default local). devbox-create adds it,
# bin/devbox-sync adds, updates or removes it when these change, and
# devbox-destroy removes it. Refused (the box still works, without backups)
# on a host running guests that aren't devboxes. Shown values are the defaults.
# backup: false
# backup_schedule: "02:00"   # Proxmox calendar event, e.g. "mon..fri 21:00"
# backup_keep: 7             # how many backups to keep
