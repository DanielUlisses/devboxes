# Defaults every client inherits. bin/devbox-config merges a client file
# over this one: mappings merge key by key, lists replace, except `skills`,
# where the client's list is appended to the base list below.
# `hostname` has no entry here: it defaults to dev-<client>.

# Git identity for commits in the box; empty means your GitHub name and
# noreply address.
git_name: ""
git_email: ""

resources:
  memory_mb: 10240   # memory ceiling
  swap_mb: 2048
  cores: 8
  disk: 40G
  onboot: true

packages: []
tools: []

# Base skills every devbox gets: skill repos, plus the mattpocock plugin.
skills:
  - ticket-skill
  - tdd-skill
  - humanizer-skill
  - mattpocock-skills

repos: []
