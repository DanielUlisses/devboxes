# Defaults every client inherits. bin/devbox-config merges a client file
# over this one: mappings merge key by key, lists replace, except `skills`,
# where the client's list is appended to the base list below.
# `hostname` has no entry here: it defaults to dev-<client>.

# What the box is for: devbox (a developer's box), runner (a locked-down
# box for CI runners, without the developer tooling or credentials) or hub
# (the tk-hub LXC: ticket-board's hub server behind tailscale serve).
role: devbox

# Proxmox host the box runs on, as its ssh name; empty means $DEVBOX_HOST.
host: ""

# Git identity for commits in the box; empty means your GitHub name and
# noreply address.
git_name: ""
git_email: ""

resources:
  memory_mb: 10240   # memory ceiling
  swap_mb: 2048
  cores: 8
  disk: 40G
  cpuunits: 100      # CPU weight against the host's other guests
  onboot: true

# The resources of a role: runner box, in place of `resources` above (its
# client's own resources: still win key by key): a low CPU weight and hard
# caps, so it can't starve the other guests on a shared host. Set here only.
runner_resources:
  memory_mb: 3072    # memory ceiling; with swap, a 4 GB hard cap
  swap_mb: 1024
  cores: 2
  disk: 16G
  cpuunits: 50       # half a default guest's CPU weight
  onboot: true

# The resources of a role: hub box, in place of `resources` (its client's
# own resources: still win key by key): tk-hub is one small web service and
# SQLite, plus a node build of its web UI on install. Set here only.
hub_resources:
  memory_mb: 2048    # memory ceiling; the web build is the peak
  swap_mb: 1024
  cores: 2
  disk: 12G          # venv, node_modules, the database
  cpuunits: 50       # half a default guest's CPU weight
  onboot: true

# A role: runner box's dispatcher (bin/devbox-runner-dispatch): its client
# file sets runners.org and runners.labels; allowed only on a runner.
runners:
  max_jobs: 2        # jobs run at once, one just-in-time runner each

# IANA time zone the box runs in.
timezone: America/Sao_Paulo

packages: []
tools: []

# Base skills every devbox gets: skill repos, plus mattpocock's (a plugin).
skills:
  - ticket-skill
  - tdd-skill
  - humanizer-skill
  - mattpocock-skills

plugins: []

# A devbox's ticket-board hub (url, ip, token_ref): none by default. Set in a
# client file only; see clients/_template.yaml.
tk_hub:

repos: []

# Proxmox backup job for the box (vzdump, snapshot mode, zstd), to the
# storage in $DEVBOX_BACKUP_STORAGE (default local). Off by default.
backup: false
backup_schedule: "02:00"   # Proxmox calendar event: daily at 02:00
backup_keep: 7             # backups kept (keep-last)
